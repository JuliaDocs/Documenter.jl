name: 'Regression Tests'
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release-*
      # You can suffix the branch name with '-runci' to run the CI on that branch
      # without having to open a pull request. This is useful for long-lived branches.
      - '*/*-runci'
    tags: '*'
  pull_request:
    # 'labeled' so that adding the opt-in label to an open PR starts a new run
    types: [opened, synchronize, reopened, labeled]
jobs:
  # The path filter that used to live on the `pull_request` trigger lives here
  # instead: a trigger-level filter would keep the workflow from starting at
  # all, leaving no place to check for the opt-in label.
  gate:
    name: 'Gate'
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.decide.outputs.run-tests }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci:
              - '.github/workflows/regression-tests.yml'
              - 'Project.toml'
      - id: decide
        run: |
          echo "run-tests=${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' || contains(github.event.pull_request.labels.*.name, 'Run Regression Tests') }}" >> "$GITHUB_OUTPUT"

  test-dependent-packages:
    name: Tests / ${{ matrix.package }}
    needs: gate
    if: needs.gate.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: 'DocumenterCitations'
          - package: 'DocumenterInterLinks'
          - package: 'DocumenterMermaid'
          - package: 'Asciicast'
          - package: 'DocumenterPages'
          - package: 'DocumenterDescriptions'
          - package: 'DocumenterVitepress'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Test
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.develop(Pkg.PackageSpec(; path = pwd()))
          Pkg.develop(ENV["PACKAGE"])
          Pkg.test(ENV["PACKAGE"])

  test-documentation-build:
    name: "Docs / ${{ matrix.package }}"
    needs: gate
    if: needs.gate.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: 'MathOptInterface'
          - package: 'Oscar'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: install-and-build-documentation
        shell: julia --color=yes {0}
        run: |
          package = "${{ matrix.package }}"
          import Pkg
          # Install the PACKAGE into `Pkg.devdir()`
          Pkg.develop(package)
          # Assume that there is an docs/Project.toml
          doc_path = joinpath(Pkg.devdir(), package, "docs")
          Pkg.activate(doc_path)
          # Change the TOML to include the package and this version of Documenter
          Pkg.develop(package)
          Pkg.develop(Pkg.PackageSpec(path=pwd()))
          # special hack to make OSCAR tests work *sigh*
          if package == "Oscar"
            #AbstractAlgebra, Nemo, Hecke, Singular, GAP, Polymake
            Pkg.add("Hecke")
          end
          # Install
          Pkg.instantiate()
          # Build the docs
          include(joinpath(doc_path, "make.jl"))

  test-julia-manual-build:
    name: "Julia Manual"
    needs: gate
    if: needs.gate.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Install LaTeX dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            python3-pygments \
            texlive-fonts-recommended \
            texlive-lang-other \
            texlive-latex-extra \
            texlive-luatex \
            texlive-plain-generic
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
      - uses: julia-actions/cache@v3
      - name: "Regressions test"
        env:
          DOCUMENTER_LATEX_SHOW_LOGS: 1
        run: julia ./.github/scripts/julia-manual-regression-test.jl .
      - uses: actions/upload-artifact@v7
        with:
          name: "regression-tests-julia-manual"
          path: julia/doc/_build/html
